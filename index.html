<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ON:LY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0;--surface:#fff;--border:#E8E4DC;--border2:#D4CFC4;
  --text:#1A1814;--text2:#6B6560;--text3:#A8A39A;
  --accent:#2D6A4F;--accent-light:#E8F5EE;--accent2:#F4A261;
  --danger:#E63946;--info:#457B9D;--purple:#7B5EA7;--purple-light:#F0EAF8;
  --r:14px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text);font-size:15px;line-height:1.6;}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100vh;}

.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px 10px;position:sticky;top:0;z-index:100;}
.nav-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.nav-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:600;letter-spacing:.05em;}
.nav-today{font-size:12px;color:var(--text3);}
.nav-tabs{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:500;border:none;background:none;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;flex-shrink:0;}
.nav-tab.on{background:var(--text);color:#fff;}

.main{flex:1;padding:16px;padding-bottom:90px;}

/* ENTRY */
.entry{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);margin-bottom:14px;overflow:hidden;}
.entry-header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;}
.entry-date{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:600;}
.entry-weekday{font-size:11px;color:var(--text3);margin-top:1px;}
.entry-mood{font-size:22px;}
.entry-stats{display:flex;gap:5px;padding:0 16px 10px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:3px 9px;font-size:11px;white-space:nowrap;}
.chip-body{background:var(--bg);color:var(--text2);}
.chip-body span{font-weight:500;color:var(--text);}
.chip-exercise{background:var(--accent-light);color:var(--accent);}
.chip-exercise span{color:var(--accent);}
.chip-book{background:var(--purple-light);color:var(--purple);}

/* ROUTINE DISPLAY */
.routine-display{padding:0 16px 10px;}
.routine-section-label{font-size:10px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;margin-top:6px;}
.routine-chips{display:flex;flex-wrap:wrap;gap:5px;}
.rchip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);}
.rchip.done{background:var(--accent);color:#fff;border-color:var(--accent);}
.rchip.skip{background:var(--bg);color:var(--text3);text-decoration:line-through;}

.entry-text{padding:4px 16px 12px;font-size:14px;color:var(--text);line-height:1.8;white-space:pre-wrap;word-break:break-all;}
.entry-book{padding:0 16px 12px;}
.book-tag{display:inline-flex;align-items:center;gap:6px;background:var(--purple-light);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--purple);}
.book-icon{font-size:15px;}
.entry-place{padding:0 16px 10px;}
.entry-place-text{font-size:13px;color:var(--text2);line-height:1.7;white-space:pre-wrap;word-break:break-all;}
.entry-place-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--info);margin-top:5px;word-break:break-all;}
.entry-footer{padding:8px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);}
.btn-sm{padding:5px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.btn-sm.danger:hover{color:var(--danger);border-color:var(--danger);}

.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-size:14px;line-height:1.8;}

.fab{position:fixed;bottom:24px;right:calc(50% - 220px);width:56px;height:56px;border-radius:50%;background:var(--text);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;z-index:200;}
@media(max-width:480px){.fab{right:20px;}}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:480px;max-height:94vh;overflow-y:auto;padding:20px 18px 40px;}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:600;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500;}
.field input,.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);}
.field input::placeholder,.field textarea::placeholder{color:var(--text3);}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
.field textarea{resize:none;min-height:80px;line-height:1.6;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-box{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;}
.stat-box label{font-size:11px;color:var(--text3);display:block;margin-bottom:3px;}
.stat-box input,.stat-box select{border:none;background:none;font-size:16px;font-weight:500;color:var(--text);width:100%;padding:0;font-family:'Noto Sans KR',sans-serif;}
.stat-box input:focus{outline:none;}
.mood-row{display:flex;gap:6px;margin-bottom:14px;}
.mood-btn{flex:1;padding:9px 4px;border:1px solid var(--border2);border-radius:var(--r-sm);background:none;font-size:14px;cursor:pointer;text-align:center;}
.mood-btn.on{border-color:var(--accent);background:var(--accent-light);}
.sec-label{font-size:11px;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:12px;font-weight:500;}

/* ROUTINE EDITOR */
.routine-editor{margin-bottom:14px;}
.routine-group{margin-bottom:12px;}
.routine-group-title{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:7px;}
.routine-toggle-row{display:flex;flex-wrap:wrap;gap:4px;}
.rt-btn{padding:3px 5px;border-radius:16px;font-size:10px;border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap;}
.rt-btn.done{background:var(--accent);color:#fff;border-color:var(--accent);}
.rt-btn.skip{background:var(--bg);color:var(--text3);border-style:dashed;}

.place-memo-box{border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px;margin-bottom:12px;background:var(--bg);}
.place-memo-box textarea{width:100%;border:none;background:none;font-size:12px;font-family:'Noto Sans KR',sans-serif;color:var(--text);resize:none;min-height:60px;line-height:1.6;outline:none;}
.place-memo-box textarea::placeholder{color:var(--text3);}
.place-link-row{display:flex;gap:6px;margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
.place-link-input{flex:1;border:none;background:none;font-size:12px;font-family:'Noto Sans KR',sans-serif;color:var(--info);outline:none;}
.place-link-input::placeholder{color:var(--text3);}
.sync-status{font-size:11px;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;}
.sync-ok{background:#e8f5ee;color:var(--accent);}
.sync-fail{background:#fce8e8;color:var(--danger);}
.sync-ing{background:var(--bg);color:var(--text3);}
.btn-primary{width:100%;padding:14px;background:var(--text);color:#fff;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:6px;}
.btn-primary:hover{opacity:.88;}

/* STATS */
.stats-header{text-align:center;padding:8px 0 18px;}
.stats-big{font-size:11px;color:var(--text3);margin-bottom:3px;}
.stats-num{font-family:'Noto Serif KR',serif;font-size:32px;font-weight:600;}
.stats-change{font-size:12px;margin-top:2px;}
.stats-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.stats-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:10px;}
.stats-card-lbl{font-size:10px;color:var(--text3);margin-bottom:4px;}
.stats-card-val{font-size:18px;font-weight:500;}
.stats-card-sub{font-size:10px;color:var(--text3);margin-top:2px;}
.chart-box{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:14px;margin-bottom:12px;}
.chart-title{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:10px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bar-lbl{font-size:10px;color:var(--text3);width:36px;text-align:right;flex-shrink:0;}
.bar-track{flex:1;background:var(--bg);border-radius:3px;height:7px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;background:var(--accent);}
.bar-fill.fat{background:var(--accent2);}
.bar-fill.book{background:var(--purple);}
.bar-val{font-size:10px;color:var(--text2);width:36px;flex-shrink:0;}

/* ROUTINE STATS */
.routine-stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.routine-stat-row:last-child{border-bottom:none;}
.routine-stat-name{color:var(--text2);}
.routine-stat-bar{flex:1;margin:0 10px;background:var(--bg);border-radius:3px;height:6px;overflow:hidden;}
.routine-stat-fill{height:100%;border-radius:3px;background:var(--accent);}
.routine-stat-pct{font-size:12px;font-weight:500;color:var(--text);width:32px;text-align:right;}



/* SETTINGS */
.setting-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:16px;margin-bottom:12px;}
.setting-title{font-size:13px;font-weight:500;margin-bottom:8px;}
.setting-note{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.6;}
.btn-outline{padding:10px 16px;border:1px solid var(--border2);border-radius:var(--r-sm);background:none;color:var(--text);font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:100%;margin-bottom:8px;text-align:center;}
.btn-outline:hover{background:var(--bg);}
.btn-outline.red{color:var(--danger);border-color:#fcc;}
.autocomplete-wrap{position:relative;margin-bottom:12px;}
.autocomplete-input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);}
.autocomplete-input:focus{outline:none;border-color:var(--accent);background:#fff;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input::placeholder,textarea::placeholder{color:var(--text3);}
input[type=number]{-moz-appearance:textfield;}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-sm);z-index:200;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.autocomplete-item{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text);}
.autocomplete-item:hover{background:var(--accent-light);color:var(--accent);}
.autocomplete-item:last-child{border-bottom:none;}

/* TIMER TAB */
.timer-hero{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:24px 18px;text-align:center;margin-bottom:16px;}
.timer-elapsed{font-family:'Noto Serif KR',serif;font-size:38px;font-weight:600;margin:10px 0 18px;}
.timer-cat-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;color:#fff;margin-bottom:6px;}
.timer-btn-stop{width:100%;padding:16px;border-radius:var(--r-sm);border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;background:var(--danger);color:#fff;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.cat-btn{padding:10px 4px;border-radius:var(--r-sm);border:1.5px solid var(--border2);background:var(--bg);font-size:11px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.timeline-day{margin-bottom:14px;}
.timeline-date{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:8px;}
.timeline-block{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);margin-bottom:6px;}
.timeline-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.timeline-info{flex:1;font-size:12px;}
.timeline-cat{font-weight:500;}
.timeline-time{color:var(--text3);font-size:11px;margin-top:1px;}
.timeline-dur{font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;}
.cat-manage-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}

/* TASKS TAB */
.task-filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
.task-filter-chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;flex-shrink:0;}
.task-filter-chip.on{color:#fff;border-color:transparent;}
.task-add-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:14px;margin-bottom:16px;}
.task-add-row{display:flex;gap:6px;margin-bottom:8px;}
.task-add-row:last-child{margin-bottom:0;}
.priority-btn{flex:1;padding:5px 2px;border-radius:var(--r-sm);font-size:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;border:1.5px solid transparent;}
.priority-btn.p-high{background:#fce8e8;color:var(--danger);border-color:#f2b3ba;}
.priority-btn.p-mid{background:#fff1e3;color:var(--accent2);border-color:#f5cfa0;}
.priority-btn.p-low{background:#eceef1;color:var(--text2);border-color:#d3d7dc;}
.priority-btn.p-high.selected{background:var(--danger);color:#fff;border-color:var(--danger);}
.priority-btn.p-mid.selected{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.priority-btn.p-low.selected{background:var(--text2);color:#fff;border-color:var(--text2);}
.pipeline-select-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.pipeline-select-btn{padding:5px 10px;border-radius:20px;font-size:11px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.pipeline-select-btn.on{color:#fff;border-color:transparent;}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);margin-bottom:8px;}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;background:none;}
.task-check.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.task-body{flex:1;min-width:0;}
.task-title{font-size:14px;color:var(--text);word-break:break-word;}
.task-title.done{color:var(--text3);text-decoration:line-through;}
.task-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center;}
.task-pipeline-tag{font-size:10px;padding:2px 8px;border-radius:20px;color:#fff;}
.task-due{font-size:11px;color:var(--text3);}
.task-due.overdue{color:var(--danger);font-weight:500;}
.task-priority-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.task-del{border:none;background:none;color:var(--text3);font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-top">
    <div class="nav-title">ON:LY</div>
    <div class="nav-today" id="nav-today"></div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab on" onclick="showTab('timer',this)">⏱️ 타임</button>
    <button class="nav-tab" onclick="showTab('diary',this)">📔 다이어리</button>
    <button class="nav-tab" onclick="showTab('tasks',this)">🎯 원씽</button>
    <button class="nav-tab" onclick="showTab('reading',this)">📖 독서</button>
    <button class="nav-tab" onclick="showTab('stats',this)">📊 통계</button>
    <button class="nav-tab" onclick="showTab('settings',this)">⚙️ 설정</button>
  </div>
</div>

<div class="main" id="main-diary" style="display:none">
  <!-- 검색바 -->
  <div style="display:flex;gap:8px;margin-bottom:14px;">
    <div style="flex:1;position:relative;">
      <input id="search-input" type="text" placeholder="🔍 검색..." oninput="renderEntries()" style="width:100%;padding:9px 14px;border:1px solid var(--border2);border-radius:20px;font-size:13px;font-family:'Noto Sans KR',sans-serif;background:var(--surface);color:var(--text);outline:none;">
    </div>
    <button onclick="toggleView()" id="view-toggle-btn" style="padding:8px 14px;border:1px solid var(--border2);border-radius:20px;font-size:12px;background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;">📋 리스트</button>
  </div>

  <!-- 달력 뷰 -->
  <div id="calendar-view" style="background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:16px;margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <button onclick="calMove(-1)" style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--text2);">‹</button>
      <div id="cal-title" style="font-family:'Noto Serif KR',serif;font-size:16px;font-weight:600;"></div>
      <button onclick="calMove(1)" style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--text2);">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;">
      <div style="text-align:center;font-size:11px;color:var(--danger);">일</div>
      <div style="text-align:center;font-size:11px;color:var(--text3);">월</div>
      <div style="text-align:center;font-size:11px;color:var(--text3);">화</div>
      <div style="text-align:center;font-size:11px;color:var(--text3);">수</div>
      <div style="text-align:center;font-size:11px;color:var(--text3);">목</div>
      <div style="text-align:center;font-size:11px;color:var(--text3);">금</div>
      <div style="text-align:center;font-size:11px;color:var(--danger);">토</div>
    </div>
    <div id="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;"></div>
  </div>

  <div id="entries-list"></div>
</div>
<div class="main" id="main-timer"><div id="timer-content"></div></div>
<div class="main" id="main-tasks" style="display:none"><div id="tasks-content"></div></div>
<div class="main" id="main-reading" style="display:none"><div id="reading-content"></div></div>
<div class="main" id="main-stats" style="display:none">
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
    <button onclick="captureStats()" style="padding:7px 14px;border-radius:20px;font-size:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;">📸 이미지로 저장</button>
  </div>
  <div id="stats-content"></div>
</div>
<div class="main" id="main-settings" style="display:none"><div id="settings-content"></div></div>

<button class="fab" id="fab-btn" onclick="openModal()" aria-label="새 일기" style="display:none">+</button>

function acFilter(key, val){
  const list=document.getElementById('ac-'+key);
  if(!list)return;
  const q=val.trim().toLowerCase();
  if(!q){list.style.display='none';return;}
  const filtered=DIET_MENUS.filter(m=>m.toLowerCase().includes(q));
  if(!filtered.length){list.style.display='none';return;}
  list.innerHTML=filtered.map(m=>`<div class="autocomplete-item" onmousedown="event.preventDefault();acSelect('${key}','${m.replace(/'/g,"&#39;")}')">${m}</div>`).join('');
  list.style.display='block';
}


const mealTags = {breakfast:[],lunch:[],dinner:[],snack:[]};

function addMealItem(key){
  const input=document.getElementById('inp-'+key);
  const val=input.value.trim();
  ['breakfast','lunch','dinner','snack'].forEach(k=>{
    const l=document.getElementById('ac-'+k);
    if(l)l.style.display='none';
  });
  if(!val)return;
  if(!mealTags[key].includes(val))mealTags[key].push(val);
  input.value='';
  renderMealTags(key);
}

function acSelect(key, val){
  document.getElementById('inp-'+key).value=val;
  addMealItem(key);
}

function renderMealTags(key){
  const box=document.getElementById('meal-tags-'+key);
  if(!box)return;
  box.innerHTML=mealTags[key].map((t,i)=>
    `<span style="display:inline-flex;align-items:center;background:var(--accent-light);color:var(--accent);border-radius:20px;padding:3px 10px;font-size:12px;gap:5px;">${t.replace(/</g,'&lt;')}<span onclick="removeMealTag('${key}',${i})" style="cursor:pointer;font-size:14px;line-height:1;">×</span></span>`
  ).join('');
}

function removeMealTag(key,idx){
  mealTags[key].splice(idx,1);
  renderMealTags(key);
}

function getMealText(key){
  return mealTags[key].join(', ');
}

let selectedCardioType2='';
function setCardioType2(type, el){
  if(selectedCardioType2===type){
    selectedCardioType2='';
    el.classList.remove('done');
  } else {
    selectedCardioType2=type;
    document.querySelectorAll('#cardio-type-row2 .rt-btn').forEach(b=>b.classList.remove('done'));
    el.classList.add('done');
  }
}

function autoBurnKcal(){
  const cardioKcal=parseFloat(document.getElementById('inp-cardio-kcal').value)||0;
  const cardio2Kcal=parseFloat(document.getElementById('inp-cardio2-kcal')?.value)||0;
  const strengthText=document.getElementById('inp-strength').value||'';
  const steps=parseFloat(document.getElementById('inp-steps').value)||0;
  const matches=[...strengthText.matchAll(/(\d+)\s*kcal/gi)];
  const strengthKcal=matches.length>0?parseFloat(matches[matches.length-1][1]):0;
  const stepsKcal=Math.round(steps*0.04);
  const total=cardioKcal+cardio2Kcal+strengthKcal+stepsKcal;
  if(total>0) document.getElementById('inp-burn-kcal').value=total;
}

function calculateIntakeKcal(){
  const meals=['breakfast','lunch','dinner','snack'];
  let totalKcal=0, totalProtein=0;
  meals.forEach(m=>{
    totalKcal+=parseFloat(document.getElementById('inp-'+m+'-kcal')?.value)||0;
    totalProtein+=parseFloat(document.getElementById('inp-'+m+'-protein')?.value)||0;
  });
  document.getElementById('inp-intake-kcal').value=totalKcal||'';
  document.getElementById('inp-intake-protein').value=totalProtein||'';
}

function acHide(key){
  const list=document.getElementById('ac-'+key);
  if(list)list.style.display='none';
}

document.addEventListener('click', function(e){
  ['breakfast','lunch','dinner','snack'].forEach(k=>{
    const wrap=document.getElementById('inp-'+k);
    const list=document.getElementById('ac-'+k);
    if(list && wrap && !wrap.contains(e.target) && !list.contains(e.target)){
      list.style.display='none';
    }
  });
});

let routineItems=[];

async function loadRoutineItems(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/routine_items?order=sort_order.asc,created_at.asc`,{
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`}
    });
    if(res.ok){
      const data=await res.json();
      if(data&&data.length>0){
        routineItems=data.map(r=>({id:r.id,group_id:r.group_id,label:r.label}));
        return;
      }
    }
  }catch(e){}
  const now=new Date().toISOString();
  routineItems=DEFAULT_ROUTINE_ITEMS.map(it=>({id:genId(),group_id:it.group_id,label:it.label}));
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/routine_items`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify(routineItems.map((r,i)=>({id:r.id,group_id:r.group_id,label:r.label,sort_order:i,created_at:now})))
    });
  }catch(e){}
}

function routineItemsByGroup(gid){ return routineItems.filter(r=>r.group_id===gid); }

async function addRoutineItem(groupId,label){
  label=(label||'').trim();
  if(!label)return;
  const id=genId();
  const sortOrder=routineItemsByGroup(groupId).length;
  routineItems.push({id,group_id:groupId,label});
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/routine_items`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify({id,group_id:groupId,label,sort_order:sortOrder,created_at:new Date().toISOString()})
    });
    showToast('✅ 루틴 추가됨');
  }catch(e){showToast('⚠️ 동기화 실패',true);}
  renderSettings();
}

async function deleteRoutineItem(id){
  if(!confirm('이 루틴 항목을 삭제할까요?'))return;
  routineItems=routineItems.filter(r=>r.id!==id);
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/routine_items?id=eq.${id}`,{
      method:'DELETE',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`}
    });
  }catch(e){}
  renderSettings();
}

async function editRoutineItem(id){
  const item=routineItems.find(r=>r.id===id);
  if(!item)return;
  const newLabel=prompt('루틴 이름을 수정하세요 (이모지 포함)', item.label);
  if(newLabel===null)return;
  const trimmed=newLabel.trim();
  if(!trimmed)return;
  item.label=trimmed;
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/routine_items?id=eq.${id}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify({label:trimmed})
    });
    if(res.ok)showToast('✅ 수정됨');
    else showToast('⚠️ 저장 실패 ('+res.status+')',true);
  }catch(e){showToast('⚠️ 동기화 실패',true);}
  renderSettings();
}

async function moveRoutineItem(id,dir){
  const item=routineItems.find(r=>r.id===id);
  if(!item)return;
  const groupList=routineItemsByGroup(item.group_id);
  const idxInGroup=groupList.findIndex(r=>r.id===id);
  const swapIdxInGroup=idxInGroup+dir;
  if(idxInGroup<0||swapIdxInGroup<0||swapIdxInGroup>=groupList.length)return;
  const other=groupList[swapIdxInGroup];
  const idxA=routineItems.findIndex(r=>r.id===item.id);
  const idxB=routineItems.findIndex(r=>r.id===other.id);
  [routineItems[idxA],routineItems[idxB]]=[routineItems[idxB],routineItems[idxA]];
  renderSettings();
  try{
    const updatedGroupList=routineItemsByGroup(item.group_id);
    await fetch(`${SUPABASE_URL}/rest/v1/routine_items`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(updatedGroupList.map((r,i)=>({id:r.id,group_id:r.group_id,label:r.label,sort_order:i})))
    });
  }catch(e){}
}

function parsePlanfit(ev){
  ev.preventDefault();
  const raw=(ev.clipboardData||window.clipboardData).getData('text');
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);

  // 요약줄 패턴: 숫자세트 / kcal / 시간(00:00:00) / 순수숫자
  const isSummary=l=>/^\d+세트$|kcal|^\d{2}:\d{2}:\d{2}$/.test(l);
  const isSet=l=>/세트|회|초|kg/.test(l);

  const summaryLines=[];
  const rest=[];
  lines.forEach(l=>{ if(isSummary(l)) summaryLines.push(l); else rest.push(l); });

  // rest를 운동명 / 세트정보로 분리
  const nameLines=[], setLines=[];
  rest.forEach(l=>{ if(isSet(l)) setLines.push(l); else nameLines.push(l); });

  let result='';
  if(nameLines.length>0 && setLines.length>0){
    const len=Math.max(nameLines.length, setLines.length);
    for(let i=0;i<len;i++){
      const name=nameLines[i]||'';
      const sets=setLines[i]||'';
      if(name||sets) result+=(name&&sets?`${name}  ${sets}`:name||sets)+'\n';
    }
  } else {
    result=rest.join('\n')+'\n';
  }
  if(summaryLines.length) result+=summaryLines.join('  ')+'\n';

  const ta=document.getElementById('inp-strength');
  const start=ta.selectionStart;
  const cur=ta.value;
  ta.value=cur.slice(0,start)+result.trim()+cur.slice(ta.selectionEnd);
  setTimeout(autoBurnKcal, 100);
}

        .sort((a,b)=>a.date.localeCompare(b.date))
        .map(e=>`[${fmtDate(e.date)}]\n${e.bookMemo}`)
        .join('\n\n');

async function syncBooksToSupabase(){
  try{
    for(const book of books){
      const flat={
        id:book.id,
        title:book.title||'',
        author:book.author||'',
        status:book.status||'reading',
        start_date:book.startDate||'',
        end_date:book.endDate||'',
        notes:book.notes||'',
        updated_at:new Date().toISOString()
      };
      // upsert
      const check=await fetch(`${SUPABASE_URL}/rest/v1/books?id=eq.${book.id}`,{
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`}
      });
      const existing=await check.json();
      if(existing&&existing.length>0){
        await fetch(`${SUPABASE_URL}/rest/v1/books?id=eq.${book.id}`,{
          method:'PATCH',
          headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
          body:JSON.stringify(flat)
        });
      } else {
        await fetch(`${SUPABASE_URL}/rest/v1/books`,{
          method:'POST',
          headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
          body:JSON.stringify(flat)
        });
      }
    }
  }catch(e){}
}

async function endSession(){
  if(!activeSession)return;
  const endTime=new Date().toISOString();
  const durMin=Math.max(1,Math.round((new Date(endTime)-new Date(activeSession.startTime))/60000));
  const sessionId=activeSession.id;
  const catName=activeSession.categoryName;
  activeSession=null;
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/time_sessions?id=eq.${sessionId}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify({end_time:endTime,duration_min:durMin})
    });
    if(res.ok){
      showToast('⏹ '+catName+' 종료 · '+durMin+'분');
      const memo=prompt('무슨 '+catName+'을(를) 하셨나요? (건너뛰려면 취소)','');
      if(memo&&memo.trim()){
        try{
          await fetch(`${SUPABASE_URL}/rest/v1/time_sessions?id=eq.${sessionId}`,{
            method:'PATCH',
            headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
            body:JSON.stringify({memo:memo.trim()})
          });
        }catch(e){}
      }
    } else {
      showToast('⚠️ 저장 실패 ('+res.status+')',true);
    }
  }catch(e){showToast('⚠️ 저장 실패',true);}
  renderTimerTab();
}

function formatElapsed(ms){
  const totalSec=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(totalSec/3600);
  const m=Math.floor((totalSec%3600)/60);
  const s=totalSec%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}

async function renderTimerTab(){
  const c=document.getElementById('timer-content');
  if(!c)return;
  clearInterval(timerTickInterval);

  let heroHtml='';
  if(activeSession){
    const cat=categories.find(x=>x.id===activeSession.categoryId);
    const color=cat?cat.color:'#999';
    heroHtml=`
      <div class="timer-hero">
        <span class="timer-cat-badge" style="background:${color}">${esc(activeSession.categoryName)}</span>
        <div class="timer-elapsed" id="timer-elapsed-num">0:00</div>
        <button class="timer-btn-stop" onclick="endSession()">⏹ 종료</button>
      </div>`;
  } else {
    heroHtml=`
      <div class="timer-hero">
        <div style="font-size:13px;color:var(--text3);margin-bottom:14px;">카테고리를 탭하면 바로 시작돼요</div>
        <div class="cat-grid">
          ${categories.map(cat=>`<button class="cat-btn" style="border-color:${cat.color};color:${cat.color};" onclick="startSession('${cat.id}')">${esc(cat.name)}</button>`).join('')}
        </div>
      </div>`;
  }
  c.innerHTML=heroHtml+'<div id="timer-timeline" style="text-align:center;color:var(--text3);font-size:13px;padding:20px;">불러오는 중...</div>';

  if(activeSession){
    const startMs=new Date(activeSession.startTime).getTime();
    const tick=()=>{
      const el=document.getElementById('timer-elapsed-num');
      if(el)el.textContent=formatElapsed(Date.now()-startMs);
    };
    tick();
    timerTickInterval=setInterval(tick,1000);
  }

  const sessions=await loadSessions();
  const byDate={};
  sessions.forEach(s=>{
    const d=s.date||(s.start_time||'').slice(0,10);
    if(!byDate[d])byDate[d]=[];
    byDate[d].push(s);
  });
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).slice(0,14);

  const timelineEl=document.getElementById('timer-timeline');
  if(!timelineEl)return;
  if(!dates.length){
    timelineEl.className='';
    timelineEl.innerHTML=`<div class="empty-state"><div class="empty-icon">⏱</div><div class="empty-text">아직 기록이 없어요.</div></div>`;
    return;
  }
  timelineEl.className='';
  timelineEl.innerHTML=dates.map(d=>{
    const items=byDate[d];
    const rows=items.map(s=>{
      const cat=categories.find(x=>x.id===s.category_id);
      const color=cat?cat.color:'#999';
      const st=new Date(s.start_time), et=new Date(s.end_time);
      const stStr=`${String(st.getHours()).padStart(2,'0')}:${String(st.getMinutes()).padStart(2,'0')}`;
      const etStr=`${String(et.getHours()).padStart(2,'0')}:${String(et.getMinutes()).padStart(2,'0')}`;
      return`<div class="timeline-block">
        <span class="timeline-dot" style="background:${color}"></span>
        <div class="timeline-info" onclick="editSessionMemo('${s.id}')" style="cursor:pointer;">
          <div class="timeline-cat" style="color:${color}">${esc(s.category_name||'')}</div>
          <div class="timeline-time">${stStr} ~ ${etStr}</div>
          ${s.memo?`<div style="font-size:11px;color:var(--text2);margin-top:3px;">📝 ${esc(s.memo)}</div>`:'<div style="font-size:11px;color:var(--text3);margin-top:3px;">+ 메모 추가</div>'}
        </div>
        <div class="timeline-dur">${s.duration_min}분</div>
        <button onclick="deleteSession('${s.id}')" style="border:none;background:none;color:var(--text3);font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;">×</button>
      </div>`;
    }).join('');
    return`<div class="timeline-day"><div class="timeline-date">${fmtDate(d)} (${getWd(d)})</div>${rows}</div>`;
  }).join('');
}

const DEFAULT_PIPELINES=[
  {name:'애터미',color:'#7B5EA7'},

  {name:'달달샵',color:'#E76F51'},

];
const PIPELINE_PALETTE=['#7B5EA7','#457B9D','#E76F51','#2D6A4F','#E9C46A','#264653','#8AB17D','#E63946'];
const PRIORITY_LABEL={high:'One Thing',mid:'Next Thing',low:'Etc Thing'};
const PRIORITY_COLOR={high:'var(--danger)',mid:'var(--accent2)',low:'var(--text3)'};
const PRIORITY_RANK={high:0,mid:1,low:2};

let pipelines=[];
let tasks=[];

async function loadPipelines(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/pipelines?order=sort_order.asc,created_at.asc`,{
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`}
    });
    if(res.ok){
      const data=await res.json();
      if(data&&data.length>0){
        pipelines=data.map(p=>({id:p.id,name:p.name,color:p.color}));
        taskAddPipelineId=pipelines[0].id;
        return;
      }
    }
  }catch(e){}
  // 처음 실행: 기본 파이프라인 시드
  pipelines=DEFAULT_PIPELINES.map(p=>({id:genId(),name:p.name,color:p.color}));
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/pipelines`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify(pipelines.map((p,i)=>({id:p.id,name:p.name,color:p.color,sort_order:i,created_at:new Date().toISOString()})))
    });
  }catch(e){}
  if(pipelines.length) taskAddPipelineId=pipelines[0].id;
}

async function addPipeline(name){
  name=(name||'').trim();
  if(!name)return;
  if(pipelines.some(p=>p.name===name)){showToast('이미 있는 파이프라인이에요',true);return;}
  const color=PIPELINE_PALETTE[pipelines.length%PIPELINE_PALETTE.length];
  const id=genId();
  pipelines.push({id,name,color});
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/pipelines`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify({id,name,color,sort_order:pipelines.length-1,created_at:new Date().toISOString()})
    });
    showToast('✅ 파이프라인 추가됨');
  }catch(e){showToast('⚠️ 동기화 실패',true);}
  renderSettings();
}

  const newName=prompt('파이프라인 이름을 수정하세요', p.name);

async function movePipeline(id,dir){
  const idx=pipelines.findIndex(p=>p.id===id);
  const swapIdx=idx+dir;
  if(idx<0||swapIdx<0||swapIdx>=pipelines.length)return;
  [pipelines[idx],pipelines[swapIdx]]=[pipelines[swapIdx],pipelines[idx]];
  renderSettings();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/pipelines`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(pipelines.map((p,i)=>({id:p.id,name:p.name,color:p.color,sort_order:i})))
    });
  }catch(e){}
}

async function addTaskFromForm(){

  if(!taskAddPipelineId&&pipelines.length) taskAddPipelineId=pipelines[0].id;
  const pipeline=pipelines.find(p=>p.id===taskAddPipelineId);
  const id=genId();
  const newTask={
    id, pipeline_id:taskAddPipelineId, pipeline_name:pipeline?pipeline.name:'',
    title, due_date:'', priority:taskAddPriority, status:'todo',
    created_at:new Date().toISOString(), completed_at:null

  input.value='';
  renderTasksTab();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/tasks`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},

  renderTasksTab();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/tasks?id=eq.${id}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify({status:t.status,completed_at:t.completed_at})

  }catch(e){}
}

  </div>`;

  const addCard=`<div class="task-add-card">

      ${pipelines.map(p=>`<button class="pipeline-select-btn ${taskAddPipelineId===p.id?'on':''}" style="${taskAddPipelineId===p.id?'background:'+p.color+';':''}" onclick="setTaskAddPipeline('${p.id}')">${esc(p.name)}</button>`).join('')}

    </div>
    <div class="task-add-row">
      <button class="priority-btn p-high ${taskAddPriority==='high'?'selected':''}" onclick="setTaskAddPriority('high')">🎯 One Thing</button>
      <button class="priority-btn p-mid ${taskAddPriority==='mid'?'selected':''}" onclick="setTaskAddPriority('mid')">➡️ Next Thing</button>

    </div>
  </div>`;

  let filtered=taskFilterPipeline==='all'?tasks:tasks.filter(t=>t.pipeline_id===taskFilterPipeline);
  const todo=filtered.filter(t=>t.status!=='done').sort((a,b)=>{

    const ad=a.due_date||'9999', bd=b.due_date||'9999';
    return ad.localeCompare(bd);
  });
  const done=filtered.filter(t=>t.status==='done').sort((a,b)=>(b.completed_at||'').localeCompare(a.completed_at||''));

  function taskRow(t){
    const pipeline=pipelines.find(p=>p.id===t.pipeline_id);
    const color=pipeline?pipeline.color:'#999';
    return`<div class="task-item">
      <button class="task-check ${t.status==='done'?'done':''}" onclick="toggleTaskDone('${t.id}')">${t.status==='done'?'✓':''}</button>
      <div class="task-body">
        <div class="task-title ${t.status==='done'?'done':''}">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="task-pipeline-tag" style="background:${color}">${esc(t.pipeline_name||'')}</span>
          <span class="task-priority-dot" style="background:${PRIORITY_COLOR[t.priority]||'var(--text3)'}"></span>
        </div>
      </div>
      <button class="task-del" onclick="deleteTask('${t.id}')">×</button>
    </div>`;
  }

  const todoHtml=todo.length?todo.map(taskRow).join(''):`<div class="empty-state" style="padding:30px 20px;"><div class="empty-icon">✅</div><div class="empty-text">할 일이 없어요.</div></div>`;
  const doneHtml=done.length?`<details style="margin-top:10px;">
    <summary style="font-size:12px;color:var(--text3);cursor:pointer;list-style:none;padding:6px 10px;background:var(--bg);border-radius:20px;width:fit-content;">✅ 완료된 업무 (${done.length})</summary>
    <div style="margin-top:8px;">${done.map(taskRow).join('')}</div>
  </details>`:'';

  c.innerHTML=filterChips+addCard+todoHtml+doneHtml;
}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmtDate(ds){const d=new Date(ds+'T00:00:00');return`${d.getMonth()+1}월 ${d.getDate()}일`;}
function getWd(ds){const d=new Date(ds+'T00:00:00');return WEEKDAYS[d.getDay()]+'요일';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}




function showTab(tab,el){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  ['diary','timer','tasks','reading','stats','settings'].forEach(t=>{

  });

  if(tab==='timer') renderTimerTab();
  if(tab==='tasks') renderTasksTab();
  if(tab==='reading') renderReadingTab();

  if(tab==='settings') renderSettings();
}

function buildRoutineEditor(state){
  state=state||{};
  const c=document.getElementById('routine-editor');
  c.innerHTML=ROUTINE_GROUP_DEFS.map(g=>{
    const items=routineItemsByGroup(g.id);
    if(!items.length)return'';
    return`
    <div class="routine-group">
      <div class="routine-group-title">${g.label}</div>
      <div class="routine-toggle-row">
        ${items.map(item=>{
          const v=state[item.id]||'none';
          return`<button class="rt-btn ${v==='done'?'done':v==='skip'?'skip':''}" 
            onclick="cycleRoutine('${item.id}',this)">${item.label}</button>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  routineState={...state};
}

function cycleRoutine(id,el){
  const cur=routineState[id]||'none';
  const next=cur==='none'?'done':cur==='done'?'skip':'none';
  routineState[id]=next;
  el.className='rt-btn'+(next==='done'?' done':next==='skip'?' skip':'');
}

async function callGemini(prompt, imageBase64=null, mimeType=null){
  const content=[];

  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,{

    headers:{'Content-Type':'application/json'},

function routineDisplayHTML(routine){
  if(!routine||!Object.keys(routine).length)return'';
  const allItems=routineItems;
  const done=allItems.filter(i=>routine[i.id]==='done');
  const skip=allItems.filter(i=>routine[i.id]==='skip');
  if(!done.length&&!skip.length)return'';
  let html='<div class="routine-display">';
  if(done.length){
    html+=`<div class="routine-section-label">완료</div><div class="routine-chips">`;
    html+=done.map(i=>`<span class="rchip done">${i.label}</span>`).join('');
    html+=`</div>`;
  }
  if(skip.length){
    html+=`<div class="routine-section-label">스킵</div><div class="routine-chips">`;
    html+=skip.map(i=>`<span class="rchip skip">${i.label}</span>`).join('');
    html+=`</div>`;
  }
  html+='</div>';
  return html;
}

let listShowCount=10;

function renderEntries(){
  const list=document.getElementById('entries-list');
  const q=(document.getElementById('search-input')?.value||'').trim().toLowerCase();
  let filtered=[...entries].sort((a,b)=>b.date.localeCompare(a.date));

  // 달력에서 날짜 선택된 경우
  if(selectedCalDate) filtered=filtered.filter(e=>e.date===selectedCalDate);

  // 검색 필터
  if(q){
    filtered=filtered.filter(e=>{
      const text=[e.text,e.breakfast,e.lunch,e.dinner,e.snack,e.food,e.place,e.bookMemo,e.strength].join(' ').toLowerCase();
      return text.includes(q);
    });
  }

  if(!filtered.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">${q||selectedCalDate?'🔍':'📓'}</div><div class="empty-text">${q?'검색 결과가 없어요.':selectedCalDate?'이 날의 기록이 없어요.':'아직 기록이 없어요.<br>+ 버튼으로 오늘의 일기를 써보세요.'}</div></div>`;
    return;
  }

  // 달력 모드나 검색 모드가 아닐 때만 개수 제한
  const limited=(!selectedCalDate&&!q);
  const shown=limited?filtered.slice(0,listShowCount):filtered;
  const hasMore=limited&&filtered.length>listShowCount;

  list.innerHTML=shown.map(e=>entryHTML(e)).join('')+
    (hasMore?`<div style="text-align:center;padding:16px;"><button onclick="listShowCount+=10;renderEntries()" style="padding:10px 24px;border:1px solid var(--border2);border-radius:20px;font-size:13px;background:none;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;">더 보기 (${filtered.length-listShowCount}개 남음)</button></div>`:'');
}

        ${muscleChange?`<div class="stats-card-sub" style="color:${muscleChange>0?'var(--accent)':'var(--danger)'}">${muscleChange>0?'+':''}${muscleChange}</div>`:''}
      </div>
      <div class="stats-card">
        <div class="stats-card-lbl">체지방률</div>

function activityGrid(sorted, period){
  if(!sorted.length) return '';
  const entryMap={};
  sorted.forEach(e=>entryMap[e.date]=e);
  const WDAYS=['S','M','T','W','T','F','S'];

  if(period===7){
    // 7일: 날짜별 O/X 표시
    const days=[];
    for(let i=6;i>=0;i--){
      const d=new Date(today);
      d.setDate(d.getDate()-i);
      days.push(d.toISOString().slice(0,10));
    }
    const exerciseRow=days.map(d=>{
      const e=entryMap[d];
      const has=e&&(e.cardioType||e.strength||e.cardio2Type);
      return`<div style="text-align:center;font-size:13px;color:${has?'var(--accent)':'var(--text3)'};">${has?'●':'○'}</div>`;
    }).join('');
    const bookRow=days.map(d=>{

function lineChart(data, key, unit, color){
  const vals=data.map(e=>parseFloat(e[key]));
  const min=Math.min(...vals);
  const max=Math.max(...vals);
  const range=max-min||0.1;
  const W=420, H=120, PX=40, PY=16;
  const iW=W-PX*2, iH=H-PY*2;
  const n=data.length;
  const pts=vals.map((v,i)=>{
    const x=PX+(i/(Math.max(n-1,1)))*iW;
    const y=PY+iH-(((v-min)/range)*iH);
    return[x,y];
  });
  const polyline=pts.map(p=>p.join(',')).join(' ');
  const area=`${PX},${PY+iH} `+pts.map(p=>p.join(',')).join(' ')+` ${PX+iW},${PY+iH}`;

  // 날짜 라벨 (최대 5개)
  const step=Math.ceil(n/5);
  const labels=pts.filter((_,i)=>i%step===0||i===n-1).map(([x],i2)=>{
    const idx=i2*step>=n?n-1:i2*step;
    const d=data[Math.min(idx,n-1)];
    const lbl=fmtDate(d.date).replace('월 ','/')+'일';
    return`<text x="${x}" y="${H-2}" text-anchor="middle" font-size="9" fill="var(--text3)">${lbl}</text>`;
  });

  // 값 라벨 (점 위)
  const dotLabels=pts.map(([x,y],i)=>`
    <circle cx="${x}" cy="${y}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>
    ${i===0||i===n-1||n<=7?`<text x="${x}" y="${y-7}" text-anchor="middle" font-size="9" fill="${color}" font-weight="600">${vals[i].toFixed(1)}</text>`:''}
  `).join('');

  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible;">
    <defs>
      <linearGradient id="g${key}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <polygon points="${area}" fill="url(#g${key})"/>
    <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dotLabels}
    ${labels.join('')}
    <text x="${PX-4}" y="${PY+4}" text-anchor="end" font-size="9" fill="var(--text3)">${max.toFixed(1)}</text>
    <text x="${PX-4}" y="${PY+iH+4}" text-anchor="end" font-size="9" fill="var(--text3)">${min.toFixed(1)}</text>
  </svg>`;
}

function viewBookNotes(id){
  const book=books.find(b=>b.id===id);
  if(!book)return;
  
  // 이 책이 포함된 일기들에서 bookMemo 날짜순으로 모으기
  const memos=entries
    .filter(e=>e.bookIds&&e.bookIds.includes(id)&&e.bookMemo)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(e=>`[${fmtDate(e.date)}]\n${e.bookMemo}`);

  const modal=document.createElement('div');
  modal.id='book-notes-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:flex;align-items:flex-end;justify-content:center;';
  const inner=document.createElement('div');
  inner.style.cssText='background:var(--surface);border-radius:14px 14px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding:20px 18px 40px;';
  const handle=document.createElement('div');
  handle.style.cssText='width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;';
  const title=document.createElement('div');
  title.style.cssText='font-size:16px;font-weight:600;margin-bottom:14px;';
  title.textContent=book.title;
  const notes=document.createElement('div');
  notes.style.cssText='font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.9;';
  notes.textContent=memos.length>0?memos.join('\n\n'):'아직 메모가 없어요.';
  const closeBtn=document.createElement('button');
  closeBtn.style.cssText='width:100%;margin-top:20px;padding:12px;background:var(--text);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:Noto Sans KR,sans-serif;';
  closeBtn.textContent='닫기';
  closeBtn.onclick=function(){document.getElementById('book-notes-modal').remove();};
  inner.appendChild(handle);inner.appendChild(title);inner.appendChild(notes);inner.appendChild(closeBtn);
  modal.appendChild(inner);
  document.body.appendChild(modal);
}
function deleteBook(id){
  if(!confirm('책을 목록에서 삭제할까요?'))return;
  books=books.filter(b=>b.id!==id);
  saveBooks();renderSettings();
}
function exportData(){
  const blob=new Blob([JSON.stringify({entries,books},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`only_diary_${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const importedEntries=Array.isArray(data)?data:(data.entries||[]);
      const importedBooks=data.books||[];
      if(!confirm(`일기 ${importedEntries.length}개, 책 ${importedBooks.length}개를 추가할까요?`))return;
      const ids=new Set(entries.map(x=>x.id));
      entries=[...entries,...importedEntries.filter(x=>!ids.has(x.id))];
      const bids=new Set(books.map(x=>x.id));
      books=[...books,...importedBooks.filter(x=>!bids.has(x.id))];
      save();saveBooks();renderEntries();alert('불러오기 완료.');
    }catch{alert('파일 형식이 올바르지 않아요.');}
  };r.readAsText(f);ev.target.value='';
}
function clearAll(){
  if(!confirm('정말 모두 삭제할까요?'))return;
  if(!confirm('한번 더 확인합니다. 삭제하시겠어요?'))return;
  entries=[];save();renderEntries();
}

/* ── UI 헬퍼 ── */
function showLoadingOverlay(msg){
  let el=document.getElementById('loading-overlay');
  if(!el){
    el=document.createElement('div');
    el.id='loading-overlay';
    el.style.cssText='position:fixed;inset:0;background:rgba(247,245,240,.92);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;color:var(--text2);';
    el.innerHTML=`<div style="font-size:28px;">☁️</div><div id="loading-msg"></div>`;
    document.body.appendChild(el);
  }
  document.getElementById('loading-msg').textContent=msg||'불러오는 중...';
  el.style.display='flex';
}
function hideLoadingOverlay(){
  const el=document.getElementById('loading-overlay');
  if(el)el.style.display='none';
}
function showToast(msg,isError){
  let el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div');
    el.id='toast';
    el.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap;transition:opacity .3s;';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.style.background=isError?'var(--danger)':'var(--text)';
  el.style.color='#fff';
  el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.opacity='0',2800);
}

async function reloadFromSheets(){
  showLoadingOverlay('☁️ 시트에서 불러오는 중...');
  const ok=await loadFromSheets();
  hideLoadingOverlay();
  if(ok){showToast('✅ 최신 데이터로 갱신됐어요');renderEntries();}
  else{showToast('❌ 시트 연결 실패',true);}
}

initApp();
</script>
